# Runs the app and its PostgreSQL database together.
# Locally:     docker compose up --build
# On EC2 the deploy job sets IMAGE and APP_PORT for staging or production.
services:
  app:
    image: ${IMAGE:-short-builds:local}
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/shortener
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortener
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
