# Production only: sends the app's logs to Amazon CloudWatch Logs.
# Needs an IAM role on the EC2 instance that allows CloudWatch Logs.
services:
  app:
    logging:
      driver: awslogs
      options:
        awslogs-group: short-builds-production
        awslogs-create-group: "true"
        awslogs-region: ap-southeast-2
