
services:
  app:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3000:3000"
    logging:
      driver: awslogs
      options:
        awslogs-group: short-builds-production
        awslogs-create-group: "true"
        awslogs-region: ap-southeast-2
